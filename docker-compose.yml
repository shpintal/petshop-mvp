# Цільове локальне/staging-оточення (потрібен Docker). Для запуску без Docker див. README → «Швидкий старт».
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: petshop, POSTGRES_PASSWORD: petshop, POSTGRES_DB: petshop }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U petshop"], interval: 5s, retries: 10 }
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment: { MEILI_MASTER_KEY: change-me-dev-key, MEILI_ENV: development }
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://petshop:petshop@postgres:5432/petshop
      HOST: 0.0.0.0
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      AUTH_SECRET: change-me
      DEMO_SEED: "1"
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: ./apps/web
    environment: { API_URL: http://api:4000/api/v1, SITE_URL: http://localhost:3000 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, meili: {} }
