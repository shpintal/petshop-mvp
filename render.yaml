# Render Blueprint: https://render.com/docs/blueprint-spec
# Один free-сервіс: вітрина + API в одному контейнері (див. Dockerfile і deploy/start.mjs).
# Free-сервіс засинає після 15 хв без трафіку — його будить .github/workflows/keepalive.yml.
# БД — Neon (free Postgres): DATABASE_URL вводиться під час створення/синхронізації Blueprint.
services:
  - type: web
    name: petshop-mvp-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_SEED
        value: "1"
      - key: DEMO_OTP
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      # API живе в тому ж контейнері; браузер ходить на /api/v1 вітрини (rewrite)
      - key: API_URL
        value: http://127.0.0.1:4000/api/v1
      - key: SITE_URL
        value: https://petshop-mvp-web.onrender.com
      - key: WEB_ORIGIN
        value: https://petshop-mvp-web.onrender.com
      - key: API_ORIGIN
        value: https://petshop-mvp-web.onrender.com
