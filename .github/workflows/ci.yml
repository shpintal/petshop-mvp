name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npm run build          # tsc strict
      - run: npm test               # unit + e2e на PGlite (без зовнішньої БД)
      - run: npm run openapi        # контракт API як артефакт
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: apps/api/openapi.json }
  api-postgres:
    # Той самий e2e-набір на справжньому PostgreSQL (драйвер node-postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: petshop, POSTGRES_PASSWORD: petshop, POSTGRES_DB: petshop }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U petshop" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
      - run: npm run db:reset
        env: { DATABASE_URL: postgres://petshop:petshop@localhost:5432/petshop }
  web:
    runs-on: ubuntu-latest
    needs: api
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env: { API_URL: http://127.0.0.1:4000/api/v1 }
